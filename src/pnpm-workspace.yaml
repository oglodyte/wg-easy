allowBuilds:
  '@parcel/watcher': false
  argon2: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# Keep optional database-driver peers (including native addons) out of the
# production dependency graph unless they are explicitly declared.
autoInstallPeers: false

minimumReleaseAgeStrict: true

publicHoistPattern:
  - '@intlify/utils'
  - '@intlify/h3'
  - 'h3'
  - 'nitropack'
  - 'ofetch'
